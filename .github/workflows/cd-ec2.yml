name: CD - Deploy RSI cross swing bot to Windows EC2

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    environment: prod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Secrets (credentials only): WINRM_PASSWORD, GH_PAT, TELEGRAM_BOT_TOKEN
      # Variables (everything else): WINRM_HOST, WINRM_USERNAME, TELEGRAM_CHAT_ID,
      #   IB_HOST, IB_PORT, IB_ACCOUNT, LIVE_MODE, LIVE_ARMED, DRY_RUN,
      #   HEALTHCHECK_URL, SLEEVE_ALLOCATIONS (optional JSON)
      #
      # Sleeves/services come from config/sleeves.yaml automatically.
      # Migrates data from C:\qqq-rsi-bot if present. Never stops OrbBot.

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install WinRM client
        run: python -m pip install --upgrade pip pywinrm

      - name: Deploy over WinRM (HTTPS 5986)
        env:
          # Secrets
          WINRM_PASSWORD: ${{ secrets.WINRM_PASSWORD }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Variables
          WINRM_HOST: ${{ vars.WINRM_HOST }}
          WINRM_USERNAME: ${{ vars.WINRM_USERNAME }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL || '' }}
          IB_HOST: ${{ vars.IB_HOST || '127.0.0.1' }}
          IB_PORT: ${{ vars.IB_PORT || '4002' }}
          IB_ACCOUNT: ${{ vars.IB_ACCOUNT || '' }}
          LIVE_MODE: ${{ vars.LIVE_MODE || 'paper' }}
          LIVE_ARMED: ${{ vars.LIVE_ARMED || 'false' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          SLEEVE_ALLOCATIONS: ${{ vars.SLEEVE_ALLOCATIONS || '' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GIT_REF: main
        run: |
          python - <<'PY'
          import json, os, sys, base64, time, winrm
          from requests.exceptions import ConnectionError as WinRMDropped

          required = ["WINRM_HOST", "WINRM_USERNAME", "WINRM_PASSWORD", "GH_PAT"]
          missing = [n for n in required if not os.environ.get(n, "").strip()]
          if missing:
              raise SystemExit("Missing GitHub settings: " + ", ".join(missing))

          host = os.environ["WINRM_HOST"]
          username = os.environ["WINRM_USERNAME"]
          password = os.environ["WINRM_PASSWORD"]
          endpoint = f"https://{host}:5986/wsman"

          def connect():
              return winrm.Session(
                  endpoint, auth=(username, password), transport="basic",
                  server_cert_validation="ignore",
                  operation_timeout_sec=300,
                  read_timeout_sec=330,
              )

          session = connect()

          def clean(name: str) -> str:
              return str(os.environ.get(name, "")).replace("\r", "").replace("\n", "").strip()

          def run_ps(script: str, name: str) -> None:
              global session
              print(f"== {name}", flush=True)
              last = None
              for attempt in range(1, 4):
                  try:
                      r = session.run_ps(script)
                      out = r.std_out.decode("utf-8", errors="replace")
                      err = r.std_err.decode("utf-8", errors="replace")
                      if out:
                          sys.stdout.write(out)
                      if err:
                          sys.stderr.write(err)
                      if r.status_code != 0:
                          raise SystemExit(f"{name} failed with status_code={r.status_code}")
                      return
                  except WinRMDropped as exc:
                      last = exc
                      sys.stderr.write(f"{name}: WinRM dropped ({exc}); retry {attempt}/3\n")
                      time.sleep(5)
                      session = connect()
              raise SystemExit(f"{name} failed after retries: {last}")

          env_lines = [
              f"IB_HOST={clean('IB_HOST')}",
              f"IB_PORT={clean('IB_PORT')}",
              f"IB_ACCOUNT={clean('IB_ACCOUNT')}",
              "DATA_DIR=data",
              f"TELEGRAM_BOT_TOKEN={clean('TELEGRAM_BOT_TOKEN')}",
              f"TELEGRAM_CHAT_ID={clean('TELEGRAM_CHAT_ID')}",
              f"HEALTHCHECK_URL={clean('HEALTHCHECK_URL')}",
              f"LIVE_MODE={clean('LIVE_MODE')}",
              f"LIVE_ARMED={clean('LIVE_ARMED')}",
              f"DRY_RUN={clean('DRY_RUN')}",
          ]
          # Optional capital overrides: SLEEVE_ALLOCATIONS JSON and/or SLEEVE_<ID>_ALLOCATED_USD
          allocations: dict[str, str] = {}
          raw_alloc = clean("SLEEVE_ALLOCATIONS")
          if raw_alloc:
              parsed = json.loads(raw_alloc)
              if not isinstance(parsed, dict):
                  raise SystemExit("SLEEVE_ALLOCATIONS must be a JSON object")
              allocations = {str(k).lower(): str(v) for k, v in parsed.items()}
          for key, value in os.environ.items():
              if key.startswith("SLEEVE_") and key.endswith("_ALLOCATED_USD") and value.strip():
                  mid = key[len("SLEEVE_") : -len("_ALLOCATED_USD")].lower()
                  if mid and mid != "allocations":
                      allocations.setdefault(mid, value.strip())
          for sid, usd in sorted(allocations.items()):
              env_lines.append(f"SLEEVE_{sid.upper()}_ALLOCATED_USD={usd}")

          clone_url = (
              f"https://x-access-token:{clean('GH_PAT')}@github.com/"
              f"{clean('GITHUB_REPOSITORY')}.git"
          )
          git_ref = clean("GIT_REF") or "main"

          run_ps(
              f"""
              $ErrorActionPreference = "Stop"
              $env:GCM_CREDENTIAL_STORE = "none"
              $env:GCM_INTERACTIVE = "never"
              $env:GIT_TERMINAL_PROMPT = "0"
              function Invoke-Native([scriptblock]$Command, [string]$Label) {{
                Write-Host $Label
                & $Command
                if ($LASTEXITCODE -ne 0) {{ throw "$Label failed with exit code $LASTEXITCODE" }}
              }}
              $repo = "C:\\rsi-cross-swing-bot"
              $legacy = "C:\\qqq-rsi-bot"
              $dataDir = Join-Path $repo "data"
              $backupDataDir = "C:\\rsi-cross-swing-bot-data-backup"
              $deployDir = Join-Path $repo "deploy"
              if (-not (Get-Command nssm -ErrorAction SilentlyContinue)) {{
                throw "nssm was not found on PATH."
              }}
              function Stop-ServiceQuick([string]$Name) {{
                $svc = Get-Service -Name $Name -ErrorAction SilentlyContinue
                if (-not $svc) {{ Write-Host "$Name not installed"; return }}
                & sc.exe stop $Name | Out-Null
                $deadline = (Get-Date).AddSeconds(12)
                while ((Get-Date) -lt $deadline) {{
                  $svc = Get-Service -Name $Name -ErrorAction SilentlyContinue
                  if (-not $svc -or $svc.Status -eq "Stopped") {{ return }}
                  Start-Sleep -Milliseconds 400
                }}
                $cim = Get-CimInstance Win32_Service -Filter "Name='$Name'" -ErrorAction SilentlyContinue
                if ($cim -and $cim.ProcessId -and $cim.ProcessId -ne 0) {{
                  & taskkill.exe /F /T /PID $cim.ProcessId | Out-Null
                }}
              }}
              Write-Host "stopping RsiCross / legacy QqqRsi services only (OrbBot untouched)"
              foreach ($n in @(
                "RsiCross-tqqq","RsiCross-goog","RsiCrossWatch","RsiCrossCtrl",
                "RsiCrossSwingBot","RsiCrossSwingWatch","QqqRsiBot","QqqRsiWatch"
              )) {{ Stop-ServiceQuick $n }}
              New-Item -ItemType Directory -Path $deployDir -Force | Out-Null
              if (Test-Path (Join-Path $repo ".git")) {{
                $prev = (git -c core.pager=cat -C $repo rev-parse HEAD).Trim()
                Set-Content -Path (Join-Path $deployDir "previous_ref.txt") -Value $prev -Encoding ascii
                Invoke-Native {{ git -c core.pager=cat -C $repo fetch origin }} "git fetch"
                Invoke-Native {{ git -c core.pager=cat -C $repo reset --hard "origin/{git_ref}" }} "git reset"
              }} else {{
                if (Test-Path $repo) {{
                  if (Test-Path $dataDir) {{
                    if (Test-Path $backupDataDir) {{ Remove-Item -Recurse -Force $backupDataDir }}
                    Move-Item -Path $dataDir -Destination $backupDataDir
                  }}
                  Remove-Item -Recurse -Force $repo
                }}
                Invoke-Native {{ git -c core.pager=cat clone "{clone_url}" $repo }} "git clone"
                if (Test-Path $backupDataDir) {{
                  New-Item -ItemType Directory -Path $repo -Force | Out-Null
                  Move-Item -Path $backupDataDir -Destination $dataDir
                }}
              }}
              # One-time migrate legacy C:\\qqq-rsi-bot\\data into new tree
              if ((Test-Path (Join-Path $legacy "data")) -and -not (Test-Path (Join-Path $dataDir "sleeves"))) {{
                Write-Host "migrating legacy data from $legacy"
                New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
                Copy-Item -Recurse -Force (Join-Path $legacy "data\\*") $dataDir
              }}
              New-Item -ItemType Directory -Path (Join-Path $repo "logs") -Force | Out-Null
              New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
              """,
              "prep/clone",
          )

          run_ps(
              """
              $ErrorActionPreference = "Stop"
              $repo = "C:\\rsi-cross-swing-bot"
              $envPath = Join-Path $repo ".env"
              $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
              [System.IO.File]::WriteAllText($envPath, "", $utf8NoBom)
              """,
              "init env",
          )

          for i, line in enumerate(env_lines, start=1):
              line_b64 = base64.b64encode((line + "\n").encode("utf-8")).decode("ascii")
              run_ps(
                  f"""
                  $ErrorActionPreference = "Stop"
                  $repo = "C:\\rsi-cross-swing-bot"
                  $envPath = Join-Path $repo ".env"
                  $line = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String("{line_b64}"))
                  $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
                  [System.IO.File]::AppendAllText($envPath, $line, $utf8NoBom)
                  """,
                  f"write env line {i}",
              )

          run_ps(
              """
              $ErrorActionPreference = "Stop"
              $helper = "C:\\rsi-cross-swing-bot\\scripts\\deploy\\Nssm-RsiCrossServices.ps1"
              Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
              & $helper -Action Stop
              """,
              "stop services",
          )

          run_ps(
              """
              $ErrorActionPreference = "Stop"
              function Invoke-Native([scriptblock]$Command, [string]$Label) {
                Write-Host $Label
                & $Command
                if ($LASTEXITCODE -ne 0) { throw "$Label failed with exit code $LASTEXITCODE" }
              }
              $repo = "C:\\rsi-cross-swing-bot"
              $venv = Join-Path $repo ".venv\\Scripts\\python.exe"
              $py = @(
                "C:\\Program Files\\Python312\\python.exe",
                "C:\\Users\\Administrator\\AppData\\Local\\Programs\\Python\\Python312\\python.exe",
                "C:\\Python312\\python.exe"
              ) | Where-Object { Test-Path $_ } | Select-Object -First 1
              if (-not $py) { $py = (Get-Command python).Source }
              if (-not (Test-Path $venv)) {
                Invoke-Native { & $py -m venv (Join-Path $repo ".venv") } "create venv"
              }
              Invoke-Native { & $venv -m pip install --upgrade pip } "pip upgrade"
              Invoke-Native { & $venv -m pip install --no-deps -r (Join-Path $repo "requirements.lock") } "pip install lock"
              Invoke-Native { & $venv -m pip install --no-deps -e $repo } "pip install package"
              """,
              "pip",
          )

          run_ps(
              """
              $ErrorActionPreference = "Stop"
              $repo = "C:\\rsi-cross-swing-bot"
              Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
              & (Join-Path $repo "scripts\\deploy\\Write-RsiCrossLaunchers.ps1") -RepoPath $repo
              & (Join-Path $repo "scripts\\deploy\\Nssm-RsiCrossServices.ps1") -Action Install -RepoPath $repo
              """,
              "launchers+nssm",
          )

          run_ps(
              """
              $ErrorActionPreference = "Continue"
              $repo = "C:\\rsi-cross-swing-bot"
              $venv = Join-Path $repo ".venv\\Scripts\\python.exe"
              $ids = & (Join-Path $repo "scripts\\deploy\\Get-SleeveIds.ps1") -RepoPath $repo
              foreach ($sid in $ids) {
                Write-Host "check --sleeve $sid"
                & $venv -m rsi_cross_swing_bot check --sleeve $sid
              }
              Write-Host "Deploy complete (check warnings above are non-fatal)."
              """,
              "check",
          )
          PY
